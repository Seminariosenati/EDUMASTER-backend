name: CI backend
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r apps/api/requirements-dev.txt && pip install --no-deps ./ml
      - name: Pruebas ML
        run: python -m pytest -q ml/tests
      - name: Pruebas API
        working-directory: apps/api
        run: python -m pytest -q tests
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t edumaster-api .
