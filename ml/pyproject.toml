[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edumaster-ml"
version = "0.1.0"
description = "EduMaster Multi-Task Learning Network: dataset, entrenamiento e inferencia"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
